services:
  postgres:
    image: postgres:17-alpine
    container_name: primary-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: prajwal-17
      POSTGRES_PASSWORD: prajwal2004
      POSTGRES_DB: grill-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - primary-pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prajwal-17 -d grill-me"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      target: backend
    env_file:
      - apps/backend/.env
      - apps/backend/.env.production
    environment:
      APP_ENV: production
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 17017
      GRILL_ME_HOME: /mnt/hdd/.config/grill-me
      DATABASE_URL: postgresql://prajwal-17:prajwal2004@postgres:5432/grill-me
      LLM_BASE_URL: ${OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:17018,http://127.0.0.1:17018}
      CODEX_HOME: /codex-state
      PROJECTS_ROOT: /mnt/hdd/code/challenges
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:17017:17017"
    volumes:
      - /mnt/hdd/.config/grill-me:/mnt/hdd/.config/grill-me
      - codex-state:/codex-state
      - /mnt/hdd/code/challenges:/mnt/hdd/code/challenges:ro
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_ENV: production
    ports:
      - "127.0.0.1:17018:17018"
    depends_on:
      - backend
volumes:
  primary-pg-data:
    external: true
    name: primary-pg-data
  codex-state:
