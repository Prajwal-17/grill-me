services:
  backend:
    build:
      context: .
      target: backend
    env_file: apps/backend/.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8017
      DATABASE_URL: /data/grill-me.sqlite
      SNAPSHOT_ROOT: /data/submissions
      UPLOAD_ROOT: /data/uploads
      WEB_ORIGIN: http://localhost:8018
      CODEX_HOME: /codex-state
    ports:
      - "127.0.0.1:8017:8017"
    volumes:
      - grill-data:/data
      - codex-state:/codex-state
      - ${GRILL_PROJECTS_PATH:-./workspace}:/projects:ro
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8017
    ports:
      - "127.0.0.1:8018:8018"
    depends_on:
      - backend
volumes:
  grill-data:
  codex-state:
