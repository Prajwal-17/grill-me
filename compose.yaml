services:
  postgres:
    image: postgres:17-alpine
    container_name: primary-production
    restart: unless-stopped
    environment:
      POSTGRES_USER: grill_me
      POSTGRES_PASSWORD: grill_me_local
      POSTGRES_DB: grill-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - primary-production-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grill_me -d grill-me"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      target: backend
    env_file: apps/backend/.env
    environment:
      APP_ENV: production
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8017
      GRILL_ME_HOME: /mnt/hdd/.config/grill-me
      DATABASE_URL: postgresql://grill_me:grill_me_local@postgres:5432/grill-me
      LLM_BASE_URL: ${OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}
      WEB_ORIGIN: http://localhost:8018
      CODEX_HOME: /codex-state
      PROJECTS_ROOT: /mnt/hdd/code/challenges
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8017:8017"
    volumes:
      - /mnt/hdd/.config/grill-me:/mnt/hdd/.config/grill-me
      - codex-state:/codex-state
      - /mnt/hdd/code/challenges:/mnt/hdd/code/challenges:ro
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8017
        NEXT_PUBLIC_APP_ENV: production
    ports:
      - "127.0.0.1:8018:8018"
    depends_on:
      - backend
volumes:
  primary-production-data:
  codex-state:
