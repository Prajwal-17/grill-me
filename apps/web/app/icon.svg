<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="pd-title pd-desc" shape-rendering="crispEdges">
  <title id="pd-title">Grill Me — pixel deluxe</title>
  <desc id="pd-desc">A detailed pixel-art charcoal grill with a sizzling marbled steak, glowing coals, polished steel legs and drifting smoke.</desc>
  <style>
.pd-smoke-a{animation:pd-smoke-rise 3.2s steps(1,end) infinite -.8s}
.pd-smoke-b{animation:pd-smoke-rise 3.8s steps(1,end) infinite -2s}
.pd-smoke-c{animation:pd-smoke-rise 3.4s steps(1,end) infinite -1.5s}
.pd-motes{animation:pd-mote-rise 2.8s steps(1,end) infinite -1.2s}
.pd-spark-a{animation:pd-spark-pop 2.4s steps(1,end) infinite -.2s}
.pd-spark-b{animation:pd-spark-pop 2.8s steps(1,end) infinite -1.4s}
.pd-spark-c{animation:pd-spark-pop 3.2s steps(1,end) infinite -2.3s}
.pd-spark-d{animation:pd-spark-pop 3.6s steps(1,end) infinite -.9s}
.pd-ember-a{animation:pd-ember-glow 2.4s steps(1,end) infinite -.4s}
.pd-ember-b{animation:pd-ember-glow 2.8s steps(1,end) infinite -1.4s}
.pd-ember-c{animation:pd-ember-glow 2.6s steps(1,end) infinite -2s}
@keyframes pd-smoke-rise{0%{transform:translate(0,2px);opacity:.25}15%{transform:translate(0,1px);opacity:.75}30%{transform:translate(-1px,0);opacity:1}45%{transform:translate(0,-1px);opacity:1}60%{transform:translate(1px,-2px);opacity:.85}75%{transform:translate(2px,-3px);opacity:.6}88%{transform:translate(1px,-4px);opacity:.35}100%{transform:translate(0,-5px);opacity:0}}
@keyframes pd-mote-rise{0%,100%{transform:translate(0,1px);opacity:.35}25%{transform:translate(1px,-1px);opacity:.8}50%{transform:translate(2px,-3px);opacity:.55}75%{transform:translate(1px,-5px);opacity:.15}}
@keyframes pd-spark-pop{0%,100%{transform:translate(0,2px);opacity:0}12%{transform:translate(0,1px);opacity:1}25%{transform:translate(1px,-1px);opacity:1}40%{transform:translate(2px,-3px);opacity:.9}55%{transform:translate(1px,-5px);opacity:.6}70%{transform:translate(2px,-7px);opacity:.25}85%{transform:translate(2px,-8px);opacity:0}}
@keyframes pd-ember-glow{0%,100%{opacity:.5}20%{opacity:.8}40%{opacity:1}60%{opacity:.7}80%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.pd-smoke-a,.pd-smoke-b,.pd-smoke-c,.pd-motes,.pd-spark-a,.pd-spark-b,.pd-spark-c,.pd-spark-d,.pd-ember-a,.pd-ember-b,.pd-ember-c{animation:none!important}}
  </style>
