extends: ./electron-builder.yml
appId: local.grill-me.desktop-dev
productName: Grill Me Dev
executableName: grill-me-dev
directories:
  output: release/dev
extraMetadata:
  desktopChannel: development
  name: grill-me-dev
  desktopName: grill-me-dev.desktop
linux:
  artifactName: grill-me-dev-${version}-${arch}.${ext}
  target:
    - deb
    - appimage
  desktop:
    entry:
      StartupWMClass: grill-me-dev
deb:
  packageName: grill-me-dev
appImage:
  artifactName: grill-me-dev-${version}-${arch}.${ext}
  # AppRun adds --no-sandbox itself only when user namespaces are unavailable.
  executableArgs: []
mac:
  artifactName: grill-me-dev-${version}-mac-${arch}.${ext}
