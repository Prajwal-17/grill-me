appId: local.grill-me.desktop
productName: Grill Me
executableName: grill-me
extraMetadata:
  name: grill-me
  desktopName: grill-me.desktop
  desktopChannel: production
directories:
  output: release/prod
files:
  - out/main/**
  - out/preload/**
  - package.json
  - "!**/.env*"
extraResources:
  - from: resources/icons/512x512.png
    to: icon.png
  - from: out/renderer
    to: renderer
  - from: resources/backend
    to: backend
publish: null
asar: true
npmRebuild: false
linux:
  artifactName: grill-me-${version}-${arch}.${ext}
  desktop:
    entry:
      StartupWMClass: grill-me
  syncDesktopName: true
  icon: resources/icons
  target:
    - deb
  category: Development
  synopsis: Local developer practice companion
deb:
  packageName: grill-me
  compression: gz

beforePack: ./scripts/validate-package.cjs
mac:
  artifactName: grill-me-${version}-mac-${arch}.${ext}
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
  identity: "-"
  hardenedRuntime: false
  notarize: false
  binaries:
    - Contents/Resources/backend/grill-me-backend
dmg:
  icon: resources/icon.icns
  sign: false
