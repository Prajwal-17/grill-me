directories:
  output: release
files:
  - out/main/**
  - out/preload/**
  - package.json
  - "!**/.env*"
extraResources:
  - from: out/renderer
    to: renderer
  - from: resources/backend
    to: backend
asar: true
npmRebuild: false
linux:
  syncDesktopName: true
  icon: resources/icon.png
  target:
    - deb
  category: Development
  synopsis: Local developer practice companion
deb:
  compression: gz
