appId: local.grill-me.desktop
productName: Grill Me
executableName: grill-me
extraMetadata:
  name: grill-me
  desktopName: grill-me.desktop
  desktopChannel: production
directories:
  output: release/prod
files:
  - out/main/**
  - out/preload/**
  - package.json
  - "!**/.env*"
extraResources:
  - from: out/renderer
    to: renderer
  - from: resources/backend
    to: backend
asar: true
npmRebuild: false
linux:
  artifactName: grill-me-${version}-${arch}.${ext}
  desktop:
    entry:
      StartupWMClass: grill-me
  syncDesktopName: true
  icon: resources/icon.png
  target:
    - deb
  category: Development
  synopsis: Local developer practice companion
deb:
  packageName: grill-me
  compression: gz
