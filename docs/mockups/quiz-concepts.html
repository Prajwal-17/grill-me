{title:'Environment variables',body:'Your app reads <code>process.env.API_URL</code>. It is defined in your laptop’s shell but missing inside the container.',ask:'What should you do?',options:['Reinstall Node.js','Use an absolute file path','Pass the variable to the container at runtime','Rename the Dockerfile'],correct:2},
{title:'File permissions',body:'The container can find a configuration file, but Node.js reports <code>EACCES: permission denied</code>.',ask:'What is the most relevant check?',options:['Whether the container user can read the file','Whether the file has a .json extension','Whether the host has a browser installed','Whether the container has a published port'],correct:0},
{title:'Multi-stage builds',body:'A config file exists in the build stage, but your final stage only copies <code>/app/dist</code>.',ask:'Why is the config missing in the final image?',options:['Multi-stage builds cannot use config files','Each stage has its own filesystem; the config was not copied','Docker removes all JSON files from final images','The final stage must use the same name'],correct:1},
{title:'Filename case',body:'Your code opens <code>Config.json</code>, but the image contains <code>config.json</code>. It worked on a case-insensitive laptop filesystem.',ask:'What should you change?',options:['Publish another port','Disable the build cache','Match the filename’s case exactly','Run two containers'],correct:2},
{title:'Inspecting the image',body:'You want to verify whether <code>/app/config.json</code> exists inside your image before starting the application.',ask:'Which approach checks the image directly?',options:['Inspect files in a temporary container created from the image','Only inspect the host project directory','Clear the browser cache','Change the API port'],correct:0}
];

    // Illustrative attempts use the repo's draft/submitted lifecycle.
    const explanations=[
      'The container has its own filesystem. A file on your laptop is available in the image only if it is included in the build context and copied by the Dockerfile. Check your COPY instructions and .dockerignore. A runtime mount is another option, but Node.js does not require one.',
      'COPY can only read files inside the build context. A parent-directory path cannot escape that boundary. Move the file into the context or build with a context that includes it.',
      'The .dockerignore file excludes matching files from the build context. An ignored configuration file will not be available to COPY, even if it exists beside your Dockerfile.',
      'WORKDIR sets the working directory for subsequent Dockerfile instructions. The relative destination in COPY config.json . resolves to /app, producing /app/config.json.',
      'A bind mount at /app obscures the image’s existing files at that path while the mount is active. The file is still in the image, but the empty host directory is what the container sees.',
      'A container does not automatically inherit your laptop’s shell environment. Pass API_URL at runtime, for example with docker run -e API_URL=... or a Compose environment setting.',
      'EACCES means access was denied. Check the file’s owner, permission bits, and the user running the Node.js process inside the container.',
      'Each build stage has its own filesystem. Only the paths explicitly copied into the final stage will be present there. Copy the configuration file separately if it is required at runtime.',
      'Linux container filesystems are typically case-sensitive. Config.json and config.json are different filenames, so the path in your code must match the actual filename exactly.',
      'Create a temporary container from the image and inspect its filesystem. This checks what was actually packaged, rather than relying on files in your host project.'
    ];

    function sidebar() {
      return `<aside class="sidebar" aria-label="Sidebar">
        <div class="brand-row"><div class="brand"><img src="${logo}" alt=""><span>Grill Me</span></div><button class="icon-button" data-action="sidebar" aria-label="Collapse sidebar">${icon('close')}</button></div>
        <button class="new-build" data-nav="New build">${icon('plus')} New build</button>
        <nav class="navigation" aria-label="Main navigation">${[['Home','home'],['Challenges','book'],['Quizzes','quiz'],['History','history'],['Logs','logs'],['Preferences','settings']].map(([name,i])=>`<button class="nav-item" data-nav="${name}" ${name==='Quizzes'?'aria-current="page"':''}>${icon(i)}<span>${name}</span></button>`).join('')}</nav>
        <div class="sidebar-bottom"><button class="appearance" data-action="theme">${icon('moon')}<span>Appearance</span><span>${light?'Light':'Dark'}</span></button><div class="account"><span class="avatar">P</span><span class="email" title="prajwalreddy.dev@gmail.com">prajwalreddy.dev@gmail.com</span>${icon('down')}</div></div>
      </aside>`;
    }

    function details() {
      return `<details class="details"><summary aria-label="Quiz details">${icon('info')} Quiz details</summary><div class="detail-content"><dl><dt>Difficulty</dt><dd>Medium</dd><dt>Questions</dt><dd>10</dd><dt>Created</dt><dd>Oct 16</dd></dl><h3>Quiz prompt</h3><p>Test my understanding of Docker and Node.js configuration using practical troubleshooting scenarios.</p></div></details>`;
    }
    function attemptControls() {
      return `<div class="attempt-controls"><label class="sr-only" for="attempt-select">Select quiz attempt</label><select id="attempt-select" class="attempt-select">${[...attempts].reverse().map(a=>`<option value="${a.number}" ${a.number===attemptNumber?'selected':''}>Attempt ${a.number} · ${a.status==='submitted'?score(a)+'/10':'In progress'}</option>`).join('')}</select>${submitted?`<button class="retake" data-action="retake">${icon('refresh')} Retake quiz</button>`:`<span class="saved" role="status">${icon('check')} ${count()?'Saved':'Autosave on'}</span>`}</div>`;
    }
    function questionMap() {
      return `<section class="question-map" ${!mapOpen&&!submitted&&concept!=='overview'?'hidden':''} id="question-map"><div class="map-heading"><h3>Overview</h3>${submitted?'<span class="map-status">Submitted</span>':`<span class="answered">${count()}/10 answered</span>`}</div><nav class="question-grid" aria-label="Jump to question">${data.map((q,i)=>{
        const right=answers[i]===q.correct;
        return `<button class="qnum ${submitted?(right?'is-correct':'is-incorrect'):answers[i]!==undefined?'answered':''}" data-question="${i}" ${index===i?'aria-current="step"':''} aria-label="Question ${i+1}, ${submitted?(right?'correct':'incorrect'):(answers[i]!==undefined?'answered':'unanswered')}"><span>${i+1}</span>${submitted?icon(right?'check':'x'):''}</button>`;
      }).join('')}</nav>${submitted?`<div class="map-legend"><span class="correct-text">${icon('check')}Correct</span><span class="incorrect-text">${icon('x')}Incorrect</span></div>`:''}</section>`;
    }
    function question() {
      const q=data[index];
      return `<div class="question-area"><p class="scenario">${q.body}</p><h2 class="question-title" id="question-title">${q.ask}</h2>
        <fieldset class="answers" aria-labelledby="question-title" ${submitted?'disabled':''}><legend>Choose one answer</legend>${q.options.map((o,i)=>{
          const right=submitted&&q.correct===i;
          const wrong=submitted&&answers[index]===i&&!right;
          const resultLabel=right?(answers[index]===i?'Your answer · Correct':'Correct answer'):wrong?'Your answer · Incorrect':'';
          return `<label class="answer ${right?'is-correct':wrong?'is-incorrect':''}"><input type="radio" name="answer" value="${i}" ${answers[index]===i?'checked':''}><span class="letter" aria-hidden="true">${'ABCD'[i]}</span><span class="answer-copy"><span>${o}</span>${resultLabel?`<span class="answer-result">${icon(right?'check':'x')}${resultLabel}</span>`:''}</span>${!submitted?icon('check','check'):''}</label>`;
        }).join('')}</fieldset>
        ${submitted?`<section class="explanation" aria-labelledby="explanation-heading"><h3 id="explanation-heading">Explanation</h3><p>${explanations[index]}</p></section>`:''}
        <footer class="question-footer"><div class="nav-buttons"><button class="btn" data-action="previous" ${index===0?'disabled':''}>${icon('left')}Previous</button><button class="btn ${submitted?'primary':''}" data-action="next" ${index===9?'disabled':''}>Next${icon('right')}</button></div>${!submitted?`<button class="btn primary" data-action="submit" ${count()!==10?'disabled':''} aria-describedby="submit-help">Submit quiz</button>`:''}</footer>
        ${!submitted&&index===9&&count()<10?`<p class="submit-help" id="submit-help">${10-count()} unanswered · <button data-action="unanswered">Go to next unanswered question</button></p>`:!submitted?'<span class="sr-only" id="submit-help">Answer all 10 questions to submit.</span>':''}
      </div>`;
    }
    function libraryContent() {
      const latest=attempts[attempts.length-1];
      return `<div class="library"><header class="quiz-header"><h1>Quizzes</h1></header><div class="library-row"><div><h2>Docker & Node.js</h2><p>Medium · 10 questions · ${latest.status==='submitted'?score(latest)+'/10 correct':Object.keys(latest.answers).length+'/10 answered'}</p></div><button class="btn primary" data-action="open-quiz">${latest.status==='submitted'?'Open quiz':'Resume quiz'} ${icon('right')}</button></div></div>`;
    }
    function render() {
      document.querySelectorAll('[data-concept]').forEach(b=>{const active=b.dataset.concept===concept;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1;});
      const panel=document.getElementById('showcase');panel.setAttribute('aria-labelledby','tab-'+concept);
      panel.innerHTML=`<div class="app ${concept} ${light?'light':''} ${collapsed?'collapsed':''} ${drawer?'drawer-open':''}"><button class="scrim" data-action="sidebar" aria-label="Close navigation"></button>${sidebar()}<div class="app-content"><header class="toolbar"><div class="toolbar-start"><button class="icon-button menu-button" data-action="sidebar" aria-label="Open navigation">${icon('menu')}</button><button class="back" data-action="library">${library?'':icon('left')}${library?'Quizzes':'All quizzes'}</button>${library?'':'<span class="toolbar-separator">/</span><span class="toolbar-title">Quiz 1</span>'}</div>${library?'':details()}</header><main class="quiz" aria-label="Quiz workspace" tabindex="-1">${library?libraryContent():`<header class="quiz-header"><div><h1>Docker & Node.js</h1><p class="quiz-meta">Medium · 10 questions</p></div>${attemptControls()}</header><div class="progress-row"><button class="question-select" data-action="map" aria-controls="question-map" aria-expanded="${mapOpen||submitted||concept==='overview'}">Question ${index+1} of 10${!submitted&&concept!=='overview'?icon('down'):''}</button><span class="answered">${submitted?`<strong class="score">${score()}/10</strong> correct`:`${count()}/10 answered`}</span></div>${!submitted?`<div class="progress-track" aria-hidden="true">${data.map((_,i)=>`<span class="${answers[i]!==undefined?'done':i===index?'current':''}"></span>`).join('')}</div>`:'<div class="submitted-rule"></div>'}${concept==='overview'?`<div class="overview-layout"><div>${question()}</div><aside class="overview-panel" aria-label="Question overview">${questionMap()}</aside></div>`:`${questionMap()}${question()}`}`}</main><p class="feedback" id="message" role="status" style="margin:0 28px 20px"></p></div></div>`;
    }
    document.addEventListener('click',e=>{
      const tab=e.target.closest('[data-concept]');if(tab){concept=tab.dataset.concept;drawer=false;render();return;}
      const nav=e.target.closest('[data-nav]');if(nav){if(nav.dataset.nav==='Quizzes'){library=true;drawer=false;render();}else document.getElementById('message').textContent=`${nav.dataset.nav} is outside this quiz mockup.`;return;}
      const num=e.target.closest('[data-question]');if(num){index=+num.dataset.question;mapOpen=false;render();document.querySelector('.quiz').focus({preventScroll:true});return;}
      const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
      switch(b.dataset.action){
        case 'sidebar':if(innerWidth<=640)drawer=!drawer;else collapsed=!collapsed;break;
        case 'theme':light=!light;break;
        case 'library':library=true;break;
        case 'open-quiz':activate(attempts[attempts.length-1].number);break;
        case 'map':if(!submitted&&concept!=='overview')mapOpen=!mapOpen;break;
        case 'previous':index=Math.max(0,index-1);break;
        case 'next':index=Math.min(9,index+1);mapOpen=false;break;
        case 'unanswered':index=Math.max(0,data.findIndex((_,i)=>answers[i]===undefined));break;
        case 'submit':if(!submitted&&count()===10){submitted=true;attempts.find(a=>a.number===attemptNumber).status='submitted';mapOpen=true;}break;
        case 'retake':{
          let draft=attempts.find(a=>a.status==='draft');
          if(!draft){draft={number:attempts[attempts.length-1].number+1,status:'draft',answers:{}};attempts.push(draft);}
          activate(draft.number);break;
        }
      }
      render();if(['next','previous','unanswered','submit','retake'].includes(b.dataset.action))document.querySelector('.quiz').focus({preventScroll:true});
    });
    document.addEventListener('change',e=>{
      if(e.target.id==='attempt-select'){activate(+e.target.value);render();document.getElementById('attempt-select').focus({preventScroll:true});}
      else if(e.target.name==='answer'&&!submitted){answers[index]=+e.target.value;const value=e.target.value;render();document.querySelector(`input[value="${value}"]`)?.focus({preventScroll:true});}
    });
    document.querySelector('.switcher').addEventListener('keydown',e=>{
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();concept=e.key==='Home'?validConcepts[0]:e.key==='End'?validConcepts[2]:validConcepts[(validConcepts.indexOf(concept)+(e.key==='ArrowRight'?1:2))%3];render();document.getElementById('tab-'+concept).focus();
    });
    document.getElementById('showcase').addEventListener('keydown',e=>{
      if(e.key==='Escape'){drawer=false;render();return;}
      if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('button,summary,select')||library)return;
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();index=Math.max(0,Math.min(9,index+(e.key==='ArrowRight'?1:-1)));render();document.querySelector('.quiz').focus({preventScroll:true});}
      else if(!submitted&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();answers[index]=answers[index]===undefined?(e.key==='ArrowDown'?0:3):(answers[index]+(e.key==='ArrowDown'?1:3))%4;render();document.querySelector(`input[value="${answers[index]}"]`).focus({preventScroll:true});}
    });
    render();
  </script>
</body>
</html>
