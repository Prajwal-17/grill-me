name: Checks
on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting, lint and types
        run: bun run check
      - name: Test isolated SQLite and local transport
        run: bun run test:desktop
      - name: Install browser and desktop test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 gnome-keyring dbus-x11 openbox
          bun run --cwd apps/desktop playwright:install
      - name: Test native secret storage in an isolated keyring
        run: bun run --cwd apps/desktop test:keyring
      - name: Check Electron source development mode
        run: |
          xvfb-run -a sh -c '
            openbox > /tmp/grill-window-manager.log 2>&1 &
            grill_window_manager_pid=$!
            trap "kill $grill_window_manager_pid 2>/dev/null || true" EXIT
            bun run --cwd apps/desktop test:dev
          '

      - name: Check standalone source development mode
        run: bun run --cwd apps/desktop test:web
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: source-smoke-${{ github.sha }}
          path: .data/*.png
          if-no-files-found: ignore
          retention-days: 7
