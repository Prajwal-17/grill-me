name: Desktop Production Build and Release
on:
  push:
    tags: ["desktop-v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (artifact only)
        required: true
        default: master
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-prod-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          test "$GITHUB_REF_NAME" = "desktop-v$version"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check source and focused tests
        run: |
          bun run check
          bun run test:desktop
      - name: Build production Debian package
        run: bun run desktop:deb
      - name: Record checksums and source identity
        working-directory: apps/desktop/release/prod
        run: |
          sha256sum ./*.deb > SHA256SUMS
          git rev-parse HEAD > SOURCE_COMMIT
      - uses: actions/upload-artifact@v7
        with:
          name: grill-me-prod-linux
          if-no-files-found: error
          path: |
            apps/desktop/release/prod/*.deb
            apps/desktop/release/prod/SHA256SUMS
            apps/desktop/release/prod/SOURCE_COMMIT
  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: grill-me-prod-linux
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.deb artifacts/SHA256SUMS artifacts/SOURCE_COMMIT \
            --verify-tag --latest --title "Grill Me ${GITHUB_REF_NAME#desktop-v}" --generate-notes
