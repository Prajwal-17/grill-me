name: Desktop Production Build and Release
on:
  push:
    tags: ["desktop-v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (artifact only)
        required: true
        default: master
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-prod-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            command: deb
            extension: deb
          - runner: macos-15
            platform: darwin
            arch: arm64
            command: dmg:arm64
            extension: dmg
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            command: dmg:x64
            extension: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          test "$GITHUB_REF_NAME" = "desktop-v$version"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check source and focused tests
        run: |
          bun run check
          bun run test:desktop
      - name: Verify native target
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bun -e 'if (process.platform !== process.env.TARGET_PLATFORM || process.arch !== process.env.TARGET_ARCH) throw new Error("Runner architecture mismatch")'
      - name: Build prod installer
        run: bun run desktop:${{ matrix.command }}
      - name: Upload production installer
        id: installer
        uses: actions/upload-artifact@v7
        with:
          name: grill-me-prod-${{ matrix.platform }}-${{ matrix.arch }}
          archive: true
          if-no-files-found: error
          retention-days: 14
          path: apps/desktop/release/prod/*.${{ matrix.extension }}
      - name: Installer download
        env:
          ARTIFACT_URL: ${{ steps.installer.outputs.artifact-url }}
        run: echo "[Download prod ${{ matrix.platform }}/${{ matrix.arch }} installer]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: grill-me-prod-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd artifacts
          sha256sum -- *.deb *.dmg > SHA256SUMS
          cd ..
          python3 scripts/release-notes.py "${GITHUB_REF_NAME#desktop-v}" > release-notes.txt
          gh release create "$GITHUB_REF_NAME" artifacts/*.deb artifacts/*.dmg artifacts/SHA256SUMS \
            --verify-tag --latest --title "Grill Me ${GITHUB_REF_NAME#desktop-v}" --notes-file release-notes.txt
