name: Desktop Production Build and Release
on:
  push:
    tags: ["desktop-v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (no release)
        required: true
        default: master
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-prod-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/desktop-v* ]]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#desktop-v}"
          python3 scripts/release-notes.py "$version" > release-notes.txt
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            gh release edit "$GITHUB_REF_NAME" --title "Grill Me $version" --notes-file release-notes.txt
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME is already published." >&2
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Grill Me $version" --notes-file release-notes.txt
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            command: deb
            extension: deb
          - runner: macos-15
            platform: darwin
            arch: arm64
            command: dmg:arm64
            extension: dmg
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            command: dmg:x64
            extension: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          test "$GITHUB_REF_NAME" = "desktop-v$version"
          python3 scripts/release-notes.py "$version" > /dev/null
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check source and focused tests
        run: |
          bun run check
          bun run test:desktop
      - name: Verify native target
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bun -e 'if (process.platform !== process.env.TARGET_PLATFORM || process.arch !== process.env.TARGET_ARCH) throw new Error("Runner architecture mismatch")'
      - name: Build prod installer
        run: bun run desktop:${{ matrix.command }}
      # Tag releases upload directly to the draft release, so release builds do
      # not consume Actions artifact storage. Manual dispatches still use a
      # temporary artifact for convenience.
      - name: Upload installer to release
        if: needs.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" apps/desktop/release/prod/*.${{ matrix.extension }} --clobber
      - name: Upload manual build artifact
        if: needs.prepare.outputs.tag == ''
        id: installer
        uses: actions/upload-artifact@v7
        with:
          name: grill-me-prod-${{ matrix.platform }}-${{ matrix.arch }}
          archive: true
          if-no-files-found: error
          retention-days: 14
          path: apps/desktop/release/prod/*.${{ matrix.extension }}
      - name: Installer summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          ARTIFACT_URL: ${{ steps.installer.outputs.artifact-url }}
        run: |
          if [ -n "$TAG" ]; then
            echo "Uploaded ${{ matrix.platform }}/${{ matrix.arch }} installer to $TAG" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$ARTIFACT_URL" ]; then
            echo "[Download prod ${{ matrix.platform }}/${{ matrix.arch }} installer]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' && needs.prepare.outputs.tag != ''
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --dir artifacts --clobber
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cd artifacts
          sha256sum -- *.deb *.dmg > SHA256SUMS
          cd ..
          gh release upload "$TAG" artifacts/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest
