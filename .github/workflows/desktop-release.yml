name: Desktop Production Build and Release
on:
  push:
    tags: ["desktop-v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (artifact only)
        required: true
        default: master
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-prod-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          test "$GITHUB_REF_NAME" = "desktop-v$version"
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if ($2 == tag) found = 1 }
            END { if (!found) exit 1 }
          ' CHANGELOG.md
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check source and focused tests
        run: |
          bun run check
          bun run test:desktop
      - name: Build production Debian package
        run: bun run desktop:deb
      - name: Record package checksum
        working-directory: apps/desktop/release/prod
        run: |
          sha256sum -- *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: grill-me-prod-linux
          if-no-files-found: error
          path: |
            apps/desktop/release/prod/*.deb
            apps/desktop/release/prod/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: grill-me-prod-linux
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="$RUNNER_TEMP/desktop-release-notes.md"
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / {
              if (found) exit
              found = $2 == tag
              next
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes_file"
          test -s "$notes_file"
          gh release create "$GITHUB_REF_NAME" artifacts/*.deb artifacts/SHA256SUMS \
            --verify-tag --latest --title "Grill Me v${GITHUB_REF_NAME#desktop-v}" \
            --notes-file "$notes_file"
