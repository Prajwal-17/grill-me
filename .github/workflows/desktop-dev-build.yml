name: Desktop Development Build
run-name: ${{ inputs.commit_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      commit_title:
        description: Optional run title
        required: false
        type: string
      branch:
        description: Branch, tag or commit to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-dev-${{ inputs.branch }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check source and isolated local runtime
        run: |
          bun run check
          bun run test:desktop
      - name: Build development Debian package
        run: bun run desktop:deb:dev
      - name: Write artifact checksums and source identity
        working-directory: apps/desktop/release/dev
        run: |
          sha256sum ./*.deb > SHA256SUMS
          git rev-parse HEAD > SOURCE_COMMIT
      - name: Upload development build
        uses: actions/upload-artifact@v7
        with:
          name: grill-me-dev-linux-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/dev/*.deb
            apps/desktop/release/dev/SHA256SUMS
            apps/desktop/release/dev/SOURCE_COMMIT
