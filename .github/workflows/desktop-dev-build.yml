name: Desktop Development Build
run-name: ${{ inputs.commit_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      commit_title:
        description: Optional run title
        required: false
        type: string
      branch:
        description: Branch, tag or commit to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-dev-${{ inputs.branch }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            command: deb
            extension: deb
          - runner: macos-15
            platform: darwin
            arch: arm64
            command: dmg:arm64
            extension: dmg
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            command: dmg:x64
            extension: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check source and isolated local runtime
        run: |
          bun run check
          bun run test:desktop
      - name: Verify native target
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bun -e 'if (process.platform !== process.env.TARGET_PLATFORM || process.arch !== process.env.TARGET_ARCH) throw new Error("Runner architecture mismatch")'
      - name: Build dev installer
        run: bun run desktop:${{ matrix.command }}:dev
      - name: Upload installer directly
        id: installer
        uses: actions/upload-artifact@v7
        with:
          name: grill-me-dev-${{ matrix.platform }}-${{ matrix.arch }}
          archive: false
          if-no-files-found: error
          retention-days: 14
          path: apps/desktop/release/dev/*.${{ matrix.extension }}
      - name: Installer download
        env:
          ARTIFACT_URL: ${{ steps.installer.outputs.artifact-url }}
        run: echo "[Download dev ${{ matrix.platform }}/${{ matrix.arch }} installer]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
