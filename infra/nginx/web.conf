server {
    listen 17018;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints built assets. Missing assets must return 404, not HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /icon.svg {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Revalidate the shell after an upgrade, including deep-link requests.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
