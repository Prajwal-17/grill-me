server {
    listen 17018;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strip the browser-facing prefix and forward to Hono over Docker DNS.
    location /api/ {
        proxy_pass http://backend:17017/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI responses are NDJSON streams; deliver each chunk immediately.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 0;
    }

    location = /api {
        return 308 /api/;
    }

    # Vite fingerprints built assets. Missing assets must return 404, not HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /icon.svg {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Revalidate the shell after an upgrade, including deep-link requests.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
